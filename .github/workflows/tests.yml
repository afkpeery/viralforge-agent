name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check JavaScript syntax
        run: node --check assets/video-lab.js
      - name: Verify preview asset links
        run: |
          test -s assets/studio-v3.css
          test -s assets/video-lab.js
          grep -q 'assets/video-lab.js' index.html
          grep -q 'id="videoLab"' index.html
      - name: Run tests
        run: pytest -q
